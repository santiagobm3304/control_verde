name: control_verde
description: "Una aplicación para mejorar precisión y optimizar tiempos."

publish_to: 'none'

version: 2.5.0+1

environment:
  sdk: ^3.6.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  mobile_scanner: ^6.0.6
  sqflite_common_ffi: ^2.3.0
  share_plus: ^10.0.0
  sqflite: ^2.4.1
  excel: ^4.0.6
  csv: ^6.0.0
  file_picker: ^9.0.2
  awesome_dialog: ^3.2.1
  intl: ^0.20.2
  path_provider: ^2.1.5
  app_settings: ^5.1.1
  socket_io_client: ^2.0.3
  permission_handler: ^11.0.1
  audioplayers: ^5.2.0
  device_info_plus: ^11.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.0
  flutter_lints: ^5.0.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/mitienda.png"

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/audio/beep.mp3
    - assets/audio/beep1.mp3
    - assets/audio/error.mp3
    - assets/audio/alert.mp3
    - assets/audio/check.mp3

