name: control_verde
description: "Una aplicación para mejorar precisión y optimizar tiempos."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.6.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  mobile_scanner: ^6.0.6
  sqflite_common_ffi: ^2.3.0
  sqflite: ^2.4.1
  excel: ^4.0.6
  csv: ^6.0.0
  file_picker: ^9.0.2
  awesome_dialog: ^3.2.1
  intl: ^0.20.2
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.0
  flutter_lints: ^5.0.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/mitienda.png"

flutter:
  uses-material-design: true
  assets:
    - assets/
